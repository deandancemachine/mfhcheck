name: SevenRooms Reservation Monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  check-reservations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check SevenRooms availability
        run: python reservation_check.py
        env:
          SEVENROOMS_API_BASE_URL: https://www.sevenrooms.com/api-yoa/availability/ng/widget/range
          SEVENROOMS_VENUE: mamasfishhouserestaurantinn
          SEVENROOMS_RESTAURANT_URL: https://mamasfishhouse.sevenrooms.com
          START_DATE: 2026-08-27
          END_DATE: 2026-08-30
          TIME_WINDOWS: dinner
          PARTY_SIZE: '2'
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EMAIL_TO: ${{ secrets.RESERVATION_EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.RESERVATION_EMAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
